<!--
  Tab Ajustes
  Lo que se usa primero (perfil, país, apariencia) arriba; información y apoyo al final.

  @author DemWolf
  @version 2.0 - REDISEÑO SIMPLIFICADO
-->

<div class="tab-configuraciones-content">

  <!-- Mi cuenta -->
  <section class="grupo">
    <h2 class="grupo-titulo">Mi cuenta</h2>

    <div class="grupo-filas">
      <button type="button" class="fila" (click)="cambiarNombrePerfil()">
        <span class="fila-icono"><ion-icon name="person-outline"></ion-icon></span>
        <span class="fila-texto">
          <strong>Nombre</strong>
          <small>{{ nombreUsuario || 'Toca para escribir tu nombre' }}</small>
        </span>
        <ion-icon name="chevron-forward" class="fila-flecha"></ion-icon>
      </button>

      <button type="button" class="fila" (click)="cambiarPais()">
        <span class="fila-icono"><ion-icon name="location-outline"></ion-icon></span>
        <span class="fila-texto">
          <strong>País y moneda</strong>
          <small *ngIf="paisActual">{{ paisActual.nombre }} · {{ paisActual.simboloMoneda }} ({{ paisActual.moneda }})</small>
          <small *ngIf="!paisActual">Toca para elegir tu país</small>
        </span>
        <ion-icon name="chevron-forward" class="fila-flecha"></ion-icon>
      </button>
    </div>
  </section>

  <!-- Apariencia -->
  <section class="grupo">
    <h2 class="grupo-titulo">Apariencia</h2>
    <div class="grupo-tarjeta">
      <app-configurador-tema></app-configurador-tema>
    </div>
  </section>

  <!-- Información -->
  <section class="grupo">
    <h2 class="grupo-titulo">Información</h2>

    <div class="grupo-filas">
      <button type="button" class="fila" (click)="mostrarAyuda()">
        <span class="fila-icono"><ion-icon name="help-circle-outline"></ion-icon></span>
        <span class="fila-texto">
          <strong>Ayuda</strong>
          <small>¿Cómo funciona CarritoControl?</small>
        </span>
        <ion-icon name="chevron-forward" class="fila-flecha"></ion-icon>
      </button>

      <button type="button" class="fila" (click)="mostrarTerminos()">
        <span class="fila-icono"><ion-icon name="document-text-outline"></ion-icon></span>
        <span class="fila-texto">
          <strong>Términos y condiciones</strong>
          <small>Uso gratuito, donación opcional</small>
        </span>
        <ion-icon name="chevron-forward" class="fila-flecha"></ion-icon>
      </button>

      <button type="button" class="fila" (click)="mostrarAcercaDe()">
        <span class="fila-icono"><ion-icon name="information-circle-outline"></ion-icon></span>
        <span class="fila-texto">
          <strong>Acerca de</strong>
          <small>Versión 1.1.0 · By DemWolf</small>
        </span>
        <ion-icon name="chevron-forward" class="fila-flecha"></ion-icon>
      </button>
    </div>
  </section>

  <!-- Apoyo (al final, sin insistir) -->
  <section class="apoyo">
    <ion-icon name="heart" class="apoyo-icono"></ion-icon>
    <div class="apoyo-texto">
      <strong>Tu privacidad es importante</strong>
      <p>La app funciona sin conexión: no recolecta, no rastrea y no vende tu información.</p>
    </div>
    <button type="button" class="apoyo-boton" (click)="abrirDonaciones()">
      Apoyar el desarrollo
    </button>
  </section>

</div>
