<!--
  Barra de Tabs Principal
  Historial · Compra (central) · Ajustes

  @author DemWolf
  @version 2.0
-->

<nav class="tab-bar-wrapper" aria-label="Navegación principal">
  <div class="semicircle-tab-bar">

    <!-- Tab Historial -->
    <button type="button" class="semicircle-btn" [class.active]="tabActivo === 'historial'" (click)="navegarATab('historial')">
      <div class="semicircle-content">
        <ion-icon name="time-outline"></ion-icon>
        <ion-label>Historial</ion-label>
      </div>
    </button>

    <!-- Tab central: nueva compra / compra en curso -->
    <button
      type="button"
      class="semicircle-btn tab-center"
      [class.active]="tabActivo === 'nueva-compra'"
      (click)="navegarATab('nueva-compra')"
      [attr.aria-label]="compraActiva ? 'Compra en curso' : 'Nueva compra'">
      <div class="center-fab">
        <ion-icon [name]="compraActiva ? 'cart' : 'add'"></ion-icon>
        <span class="center-badge" *ngIf="compraActiva && cantidadProductos > 0">{{ cantidadProductos }}</span>
      </div>
      <ion-label class="center-label">{{ compraActiva ? 'Mi compra' : 'Nueva' }}</ion-label>
    </button>

    <!-- Tab Configuraciones -->
    <button type="button" class="semicircle-btn" [class.active]="tabActivo === 'configuraciones'" (click)="navegarATab('configuraciones')">
      <div class="semicircle-content">
        <ion-icon name="settings-outline"></ion-icon>
        <ion-label>Ajustes</ion-label>
      </div>
    </button>

  </div>
</nav>
